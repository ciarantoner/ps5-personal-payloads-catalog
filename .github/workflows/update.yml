name: Update payloads.json

on:
  push:
    branches: [main]
    paths:
      - repos.txt
      - scripts/update_payloads.py
      - .github/workflows/update.yml
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-payloads
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build payloads.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_payloads.py

      - name: Commit and push (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payloads.json
          if git diff --cached --quiet; then
            echo "No changes to payloads.json"
            exit 0
          fi
          git commit -m "chore: update payloads.json"
          git pull --rebase origin main
          git push origin HEAD:main
