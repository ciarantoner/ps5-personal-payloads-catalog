<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS5 Personal Payloads Catalog</title>
<style>
  :root { --bg: #0d1017; --muted: #8b95a7; --err: #ef4444; }
  body { margin: 0; background: var(--bg); color: var(--muted); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 32px 16px; text-align: center; }
  .err { color: var(--err); }
</style>
</head>
<body>
<p id="status">Loading…</p>
<script>
// This file only decides where the management page's code comes from, based on ../config.json:
//   "upstream" -> the released version (git tag) of the original repository, so forks get
//                 improvements without syncing;
//   "local"    -> this repository's own manage/app.html.
// Either way the page runs here, in this browser, against this repository. Nothing is sent to
// the upstream repository; it only provides the code.
(async () => {
  const DEFAULTS = { source: 'upstream', upstream: 'rfarkv/ps5-personal-payloads-catalog', version: 'v1' };
  const status = document.getElementById('status');

  let cfg = DEFAULTS;
  try {
    const res = await fetch('../config.json', { cache: 'no-store' });
    if (res.ok) cfg = { ...DEFAULTS, ...(await res.json()) };
  } catch {}

  // Which GitHub repository is this page? Same rule as the app: OWNER.github.io/REPO/manage/
  let self = '';
  if (location.hostname.endsWith('.github.io')) {
    const owner = location.hostname.replace(/\.github\.io$/, '');
    const first = location.pathname.split('/').filter(Boolean)[0];
    self = `${owner}/${first && first !== 'manage' && !first.includes('.') ? first : `${owner}.github.io`}`;
  }
  // The upstream repository itself (and local testing) always runs its own code.
  const isUpstream = self.toLowerCase() === String(cfg.upstream).toLowerCase();
  const useUpstream = cfg.source === 'upstream' && self !== '' && !isUpstream;

  const load = async (url) => {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.text();
  };

  let html;
  let active = useUpstream ? 'upstream' : 'local';
  try {
    html = await load(useUpstream
      ? `https://raw.githubusercontent.com/${cfg.upstream}/${cfg.version}/manage/app.html`
      : 'app.html');
  } catch (e) {
    if (!useUpstream) { status.innerHTML = `<span class="err">Could not load the page (${e.message}).</span>`; return; }
    // Upstream unreachable: fall back to this repository's own copy.
    try { html = await load('app.html'); active = 'local'; }
    catch (e2) { status.innerHTML = `<span class="err">Could not load the page (${e2.message}).</span>`; return; }
  }

  window.__PS5PL_SOURCE__ = { ...cfg, active, self, isUpstream };
  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
